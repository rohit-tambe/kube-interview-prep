apiVersion: v1
kind: Pod
metadata:
  name: broken-liveness-demo
  namespace: practice
  labels:
    app: broken-liveness
spec:
  containers:
  - name: web
    image: nginx:1.25
    ports:
    - containerPort: 80
    livenessProbe:
      httpGet:
        path: /non-existent-health-check
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 3
      failureThreshold: 2
